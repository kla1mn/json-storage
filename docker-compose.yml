services:
  app:
    build: .
    container_name: json-storage
    environment:
      POSTGRES__DSN: postgresql://json:json@postgres:5432/jsonstorage
      ELASTIC_SEARCH__DSN: http://elastic-data:9200
      REDIS__DSN: redis://redis:6379
      RABBIT_MQ__DSN: amqp://guest:guest@rabbitmq:5672/
      ENVIRONMENT: local
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      elastic-data:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_LOGS: "-"
      RABBITMQ_SASL_LOGS: "-"
    hostname: "rabbit"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: jsonstorage
      POSTGRES_USER: json
      POSTGRES_PASSWORD: json
    command:
      ["postgres",
       "-c", "log_min_duration_statement=0",
       "-c", "log_connections=on",
       "-c", "log_disconnections=on",
       "-c", "log_line_prefix=%m [%p] %u@%d %r"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U json -d jsonstorage"]
      interval: 5s
      timeout: 5s
      retries: 20

  elastic-data:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    container_name: elastic-data
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.name=es-data
      - logger.org.elasticsearch.http.HttpTracer=TRACE
      - http.tracer.include="*"
      - http.tracer.exclude="/_cluster/health*,/_nodes*,/_cat*"
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL",
         "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow\\&timeout=1s >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    container_name: redis
    image: redis:latest
    ports:
      - "6379:6379"

  prometheus:
    build: ./prometheus
    container_name: prometheus
    command: --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"

      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  elastic-logs:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    container_name: elastic-logs
    environment:
      - discovery.type=single-node
      - cluster.name=es-logs
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9201:9200"
    volumes:
      - eslogs:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.2
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elastic-logs:9200
      - XPACK_SECURITY_ENABLED=false
    ports:
      - "5601:5601"
    depends_on:
      - elastic-logs

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.2
    container_name: filebeat
    user: root
    command: ["-e", "--strict.perms=false"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elastic-logs
      - kibana

  taskiq-worker:
    build: .
    container_name: taskiq-worker
    environment:
      POSTGRES__DSN: postgresql://json:json@postgres:5432/jsonstorage
      ELASTIC_SEARCH__DSN: http://elastic-data:9200
      REDIS__DSN: redis://redis:6379
      RABBIT_MQ__DSN: amqp://guest:guest@rabbitmq:5672/
      ENVIRONMENT: local
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      elastic-data:
        condition: service_healthy
    restart: unless-stopped
    command:
      ["uv", "run", "taskiq", "worker",
      "json_storage.cmd.taskiq_broker:taskiq_broker", "json_storage.tasks", "--log-level=DEBUG"]

volumes:
  pgdata:
  esdata:
  eslogs:
  grafana-data:
  rabbitmq-data:
    name: rabbitmq-data
